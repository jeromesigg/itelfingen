name: Tests

on:
  push:
    branches:
      - 'develop'
  pull_request:
  # Vom Prod-Build aufgerufen, damit auf master nur getestete Stände gebaut werden.
  workflow_call:

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:

      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: 🗄️ Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Stil nach pint.json. Lokal beheben mit: ./vendor/bin/pint
      - name: 🎨 Check code style
        run: vendor/bin/pint --test

  phpunit:
    runs-on: ubuntu-latest
    steps:

      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, curl, xml, fileinfo
          coverage: none

      - name: 🗄️ Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 🧹 Create Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      # Datenbank: SQLite in-memory aus phpunit.xml, kein MySQL nötig.
      - name: 🧪 Run tests
        run: vendor/bin/phpunit
